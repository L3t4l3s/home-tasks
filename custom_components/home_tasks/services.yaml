      selector:
        text:
    sub_task_title:
      name: Sub-task Title
      description: Current title of the sub-task (case-insensitive).
      selector:
        text:
    sub_task_id:
      name: Sub-task ID
      description: ID of the sub-task, as get_tasks returns it (alternative to sub-task title).
      selector:
        text:
