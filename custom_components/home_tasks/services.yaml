add_task:
  name: Add Task
  description: Create a new task in a task list.
  fields:
    list_name:
      name: List Name
      description: The name of the task list.
      example: "Shopping List"
      selector:
        text:
    entry_id:
      name: Entry ID
      description: The config entry ID of the list (alternative to list name).
      selector:
        text:
    entity_id:
      name: Linked list entity
      description: >-
        The todo entity of a linked external list, when you would rather name
        it directly than by list name.
      example: "todo.all_tasks"
      selector:
        entity:
          domain: todo
    title:
      name: Title
      description: The task title.
      required: true
      example: "Buy milk"
      selector:
        text:
    assigned_person:
      name: Assigned Person
      description: Person entity to assign (e.g. person.john).
      selector:
        entity:
          domain: person
    due_date:
      name: Due Date
      description: Due date in YYYY-MM-DD format.
      selector:
        date:
    due_time:
      name: Due Time
      description: Due time in HH:MM format (only used together with due_date).
      selector:
        time:
    notes:
      name: Notes
      description: Task notes.
      selector:
        text:
          multiline: true
    priority:
      name: Priority
      description: 1 (low), 2 (medium) or 3 (high).
      selector:
        number:
          min: 1
          max: 3
    tags:
      name: Tags
      description: Comma-separated list of tags (e.g. "kitchen,daily").
      selector:
        text:
    reminders:
      name: Reminders
      description: Comma-separated minute offsets before the due moment (0 = at due time), e.g. "0,60,1440".
      selector:
        text:
    sub_tasks:
      name: Sub-tasks
      description: >-
        Titles of sub-tasks to create with the task, as a list. They start
        unchecked.
      example: '["Milk", "Bread"]'
      selector:
        text:
          multiple: true
    assigned_persons:
      name: Assigned persons
      description: Everyone the task is assigned to, as comma-separated person entity ids (the first is the primary assignee). Overrides assigned_person.
      selector:
        text:
    section:
      name: Section
      description: >-
        Name (or id) of a section in the list. Left out, the list's default section applies.
      example: "Kitchen"
      selector:
        text:
    image_url:
      name: Picture URL
      description: >-
        A picture for the task — an https:// URL, /local/… or a media-source://
        id. A media-source:// id or an internal HA path is copied to
        /local/home_tasks so every device can load it; a URL is kept as given.
      selector:
        text:
    generate_image:
      name: Draw a picture
      description: >-
        Draw the task's picture with the AI task entity of the list's card
        (its image-generation options), as the card's button does.
      selector:
        boolean:
    position:
      name: Position
      description: >-
        Put the task at the top or bottom of the list's manual order — what
        the card shows when it sorts manually, within the task's section. Left out, a new task goes to the bottom.
      selector:
        select:
          options:
            - top
            - bottom
    recurrence:
      name: Recurrence
      description: Repeat the task, as in the card's task editor.
      collapsed: true
      fields:
        recurrence_enabled:
          name: Recurring
          description: >-
            Set any other recurrence field and the task recurs; this is only
            needed to switch recurrence off.
          selector:
            boolean:
        recurrence_value:
          name: Every
          description: The interval count — every 2 weeks is 2 and weeks.
          selector:
            number:
              min: 1
              max: 365
        recurrence_unit:
          name: Unit
          description: >-
            hours, days, weeks, months or years. Needed when the task has
            never recurred.
          selector:
            select:
              options:
                - hours
                - days
                - weeks
                - months
                - years
        recurrence_weekdays:
          name: Weekdays
          description: >-
            Weekly: the days it repeats on (mon … sun). Monthly: the one day
            for recurrence_nth_week. An empty list ends a weekday pattern.
          example: '["mon", "thu"]'
          selector:
            select:
              multiple: true
              options:
                - mon
                - tue
                - wed
                - thu
                - fri
                - sat
                - sun
        recurrence_day_of_month:
          name: Day of month
          description: Monthly on this day (1–31, or "last").
          example: "15"
          selector:
            text:
        recurrence_nth_week:
          name: Week of month
          description: >-
            Monthly on the nth weekday (1–4, or "last"), with one day in
            recurrence_weekdays — e.g. the 2nd Tuesday.
          example: "2"
          selector:
            text:
        recurrence_anniversary:
          name: Yearly on
          description: Yearly on this date, as MM-DD.
          example: "03-14"
          selector:
            text:
        recurrence_anchor:
          name: Count from
          description: >-
            Without a fixed day: count the next date from the completion
            (default) or from the due date.
          selector:
            select:
              options:
                - completion
                - due
        recurrence_start_date:
          name: Start
          description: Recurrence starts on this date.
          selector:
            date:
        recurrence_time:
          name: Time
          description: Time of day the task becomes due again.
          selector:
            time:
        recurrence_end_date:
          name: Until
          description: Recurrence ends after this date.
          selector:
            date:
        recurrence_max_count:
          name: Times
          description: Recurrence ends after this many repetitions.
          selector:
            number:
              min: 1
              max: 999
        recurrence_reopen_lead:
          name: Reopen early
          description: >-
            Minutes before the next due moment the completed task opens again,
            shorter than the interval (1440 = a day). Home Tasks lists only;
            left out, a task that starts recurring takes the list's default.
          selector:
            number:
              min: 0
              max: 525600
              unit_of_measurement: min
              mode: box

add_task_from_text:
  name: Add Task From Text
  description: >-
    Create a task from a spoken-style sentence. Clauses at the end of the text
    fill the task's fields — a person ("for Anna"), a priority ("with high
    priority"), a due date ("due Friday", "tomorrow", "on 5 October", "in 3
    days") and a time ("at 5 pm") — in any order; everything else is the
    title. Words are understood in English and German. Returns what was
    created, including a short spoken summary in "details".
  fields:
    list_name:
      name: List Name
      description: The name of the task list.
      example: "Household"
      selector:
        text:
    entry_id:
      name: Entry ID
      description: The config entry ID of the list (alternative to list name).
      selector:
        text:
    entity_id:
      name: Linked list entity
      description: >-
        The todo entity of a linked external list, when you would rather name
        it directly than by list name.
      example: "todo.all_tasks"
      selector:
        entity:
          domain: todo
    text:
      name: Text
      description: The sentence, without the command in front of it.
      required: true
      example: "pay the bill for Anna with high priority due Friday at 5 pm"
      selector:
        text:
    language:
      name: Language
      description: >-
        Language of the text ("en", "de"). Defaults to the Home Assistant
        language; languages without their own word list are read as English.
      example: "de"
      selector:
        text:

get_tasks:
  name: Get Tasks
  description: >-
    Return a list's tasks with every Home Tasks field — assignee, tags,
    priority, sub-tasks — which todo.get_items can't carry. Use it with
    response_variable in automations and trigger-based template sensors.
  fields:
    list_name:
      name: List Name
      description: The name of the task list.
      example: "Household"
      selector:
        text:
    entry_id:
      name: Entry ID
      description: The config entry ID of the list (alternative to list name).
      selector:
        text:
    entity_id:
      name: Linked list entity
      description: The todo entity of a linked external list.
      example: "todo.all_tasks"
      selector:
        entity:
          domain: todo
    status:
      name: Status
      description: Which tasks to return.
      default: open
      selector:
        select:
          options:
            - open
            - completed
            - all
    assigned_person:
      name: Assigned person
      description: Only tasks assigned to this person.
      selector:
        entity:
          domain: person
    tag:
      name: Tag
      description: Only tasks with this tag.
      selector:
        text:
    due:
      name: Due
      description: Only tasks due today, overdue, or either.
      selector:
        select:
          options:
            - today
            - overdue
            - today_or_overdue

