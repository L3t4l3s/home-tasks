move_task:
  name: Move Task
  description: >-
    Move a task to another list — same as the card's Move button. Target is
    either a native list (target_list_name / target_entry_id) or a linked
    external todo entity (target_entity_id).
  fields:
    list_name:
      name: List Name
      description: The name of the source list.
      selector:
        text:
    entry_id:
      name: Entry ID
      description: The config entry ID of the source list (alternative to list name).
      selector:
        text:
    source_entity_id:
      name: Source Entity
      description: Linked external todo entity to move the task out of (requires task_id).
      selector:
        entity:
          domain: todo
    task_title:
      name: Task Title
      description: Title of the task to move (alternative to task_id).
      selector:
        text:
    task_id:
      name: Task ID
      description: UUID of the task to move.
      selector:
        text:
    target_list_name:
      name: Target List Name
      description: Name of the native list to move the task into.
      selector:
        text:
    target_entry_id:
      name: Target Entry ID
      description: Config entry ID of the native target list.
      selector:
        text:
    target_entity_id:
      name: Target Entity
      description: Linked external todo entity to move the task into.
      selector:
        entity:
          domain: todo

complete_task:
  name: Complete Task
  description: >-
    Mark a task as completed. Provide task_title or task_id for a single task,
    or tag to complete all open tasks with that tag.
  fields:
    list_name:
      name: List Name
      description: The name of the task list.
      selector:
        text:
    entry_id:
      name: Entry ID
      description: The config entry ID of the list (alternative to list name).
      selector:
        text:
    entity_id:
      name: Linked list entity
      description: >-
        The todo entity of a linked external list, when you would rather name
        it directly than by list name.
      example: "todo.all_tasks"
      selector:
        entity:
          domain: todo
    task_title:
      name: Task Title
      description: Title of the task to complete.
      selector:
        text:
    task_id:
      name: Task ID
      description: UUID of the task (alternative to task title).
      selector:
        text:
    tag:
      name: Tag
      description: >-
        Complete all open tasks with this tag. Alternative to task_title/task_id.
      selector:
        text:

assign_task:
  name: Assign Task
  description: Assign a person to a task.
  fields:
    list_name:
      name: List Name
      description: The name of the task list.
      selector:
        text:
    entry_id:
      name: Entry ID
      description: The config entry ID of the list (alternative to list name).
      selector:
        text:
    entity_id:
      name: Linked list entity
      description: >-
        The todo entity of a linked external list, when you would rather name
        it directly than by list name.
      example: "todo.all_tasks"
      selector:
        entity:
          domain: todo
    task_title:
      name: Task Title
      description: Title of the task.
      selector:
        text:
    task_id:
      name: Task ID
      description: UUID of the task (alternative to task title).
      selector:
        text:
    person:
      name: Person
      description: Person entity to assign.
      required: true
      selector:
        entity:
          domain: person

reopen_task:
  name: Reopen Task
  description: >-
    Reopen a completed task. Provide task_title or task_id to reopen a single
    task, or assigned_person to reopen all completed tasks for that person.
  fields:
    list_name:
      name: List Name
      description: The name of the task list.
      selector:
        text:
    entry_id:
      name: Entry ID
      description: The config entry ID of the list (alternative to list name).
      selector:
        text:
    entity_id:
      name: Linked list entity
      description: >-
        The todo entity of a linked external list, when you would rather name
        it directly than by list name.
      example: "todo.all_tasks"
      selector:
        entity:
          domain: todo
    task_title:
      name: Task Title
      description: Title of the task to reopen.
      selector:
        text:
    task_id:
      name: Task ID
      description: UUID of the task to reopen (alternative to task title).
      selector:
        text:
    assigned_person:
      name: Assigned Person
      description: >-
        Person entity. If provided without task_title/task_id, all completed
        tasks assigned to this person will be reopened.
      selector:
        entity:
          domain: person
    tag:
      name: Tag
      description: >-
        Reopen all completed tasks with this tag. Can be combined with
        assigned_person to narrow the selection.
      selector:
        text:
    tags:
      name: Tags (ALL must match)
      description: >-
        Comma-separated list of tags. Only tasks that carry ALL specified tags
        are reopened (AND-logic). Supersedes the single `tag` field when both
        are provided. Can be combined with assigned_person.
        Example: "fussball_mittag, ferien_ja"
      selector:
        text:

add_sub_task:
  name: Add Sub-task
  description: >-
    Add a sub-task to a task. Works on Home Tasks lists and linked lists (on
    Todoist as a real sub-task, elsewhere kept by Home Tasks). Returns the new
    sub-task's id.
  fields:
    list_name:
      name: List Name
      description: The name of the task list.
      selector:
        text:
    entry_id:
      name: Entry ID
      description: The config entry ID of the list (alternative to list name).
      selector:
        text:
    entity_id:
      name: Linked list entity
      description: >-
        The todo entity of a linked external list, when you would rather name
        it directly than by list name.
      example: "todo.all_tasks"
      selector:
        entity:
          domain: todo
    task_title:
      name: Task Title
      description: Title of the task the sub-task belongs to.
      selector:
        text:
    task_id:
      name: Task ID
      description: ID of the task (alternative to task title).
      selector:
        text:
    title:
      name: Title
      description: The sub-task's title.
      required: true
      example: "Milk"
      selector:
        text:

update_sub_task:
  name: Update Sub-task
  description: >-
    Rename a sub-task or check it off. Find it by sub_task_title or
    sub_task_id; when two share a title, the one not yet in the requested
    state is changed.
  fields:
    list_name:
      name: List Name
      description: The name of the task list.
      selector:
        text:
    entry_id:
      name: Entry ID
      description: The config entry ID of the list (alternative to list name).
      selector:
        text:
    entity_id:
      name: Linked list entity
      description: >-
        The todo entity of a linked external list, when you would rather name
        it directly than by list name.
      example: "todo.all_tasks"
      selector:
        entity:
          domain: todo
    task_title:
      name: Task Title
      description: Title of the task the sub-task belongs to.
      selector:
        text:
    task_id:
      name: Task ID
      description: ID of the task (alternative to task title).
      selector:
        text:
    sub_task_title:
      name: Sub-task Title
      description: Current title of the sub-task (case-insensitive).
      selector:
        text:
    sub_task_id:
      name: Sub-task ID
      description: ID of the sub-task, as get_tasks returns it (alternative to sub-task title).
      selector:
        text:
    title:
      name: New Title
      description: The sub-task's new title.
      selector:
        text:
    completed:
      name: Completed
      description: Check the sub-task off (true) or uncheck it (false).
      selector:
        boolean:

remove_sub_task:
  name: Remove Sub-task
  description: Delete a sub-task from a task.
  fields:
    list_name:
      name: List Name
      description: The name of the task list.
      selector:
        text:
    entry_id:
